<g fill="#f6e7c8"><ellipse cx="44" cy="186" rx="7" ry="12" transform="rotate(-28 44 186)"/><ellipse cx="60" cy="186" rx="7" ry="12" transform="rotate(28 60 186)"/><ellipse cx="44" cy="210" rx="7" ry="12" transform="rotate(-28 44 210)"/><ellipse cx="60" cy="210" rx="7" ry="12" transform="rotate(28 60 210)"/><ellipse cx="44" cy="234" rx="7" ry="12" transform="rotate(-28 44 234)"/><ellipse cx="60" cy="234" rx="7" ry="12" transform="rotate(28 60 234)"/><ellipse cx="52" cy="164" rx="6" ry="12"/></g></g>
