<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Forno assando pão">
<style>
.blob{fill:#fff;opacity:.08}
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 4s ease-in-out infinite}
@keyframes rise{0%,100%{transform:scaleY(.72) scaleX(.94)}55%{transform:scaleY(1) scaleX(1)}}
.glow{animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.18}55%{opacity:.42}}
.steam path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;opacity:0;animation:steam 3.2s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:1s}.steam path:nth-child(3){animation-delay:2s}
@keyframes steam{0%{opacity:0;transform:translateY(14px)}30%{opacity:.7}100%{opacity:0;transform:translateY(-26px)}}
.led{animation:led 1.6s ease-in-out infinite}
@keyframes led{50%{opacity:.35}}
.wheat{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite}
.wheat.w2{animation-delay:-1.4s}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.flour circle{fill:#fff;opacity:0;animation:flour 5s linear infinite}
.flour circle:nth-child(2){animation-delay:1.2s}.flour circle:nth-child(3){animation-delay:2.5s}.flour circle:nth-child(4){animation-delay:3.7s}
@keyframes flour{0%{opacity:0;transform:translate(0,0)}20%{opacity:.8}100%{opacity:0;transform:translate(18px,-60px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle class="blob" cx="205" cy="172" r="142"/>
<g class="steam"><path d="M170 96c-8-10 8-18 0-30"/><path d="M200 92c-8-10 8-18 0-30"/><path d="M230 96c-8-10 8-18 0-30"/></g>
<rect x="92" y="112" width="220" height="172" rx="20" fill="#fff"/>
