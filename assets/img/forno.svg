<rect x="92" y="136" width="220" height="16" fill="#e3ecf6"/>
<circle cx="124" cy="132" r="8" fill="#133e79"/><circle cx="152" cy="132" r="8" fill="#133e79"/>
<circle class="led" cx="282" cy="132" r="7" fill="#008940"/>
<rect x="116" y="166" width="172" height="96" rx="14" fill="#0d2c57"/>
<rect class="glow" x="116" y="166" width="172" height="96" rx="14" fill="#e9b85c"/>
<rect x="132" y="246" width="140" height="6" rx="3" fill="#5c7aa6"/>
