<g fill="#f6e7c8"><ellipse cx="342" cy="206" rx="7" ry="12" transform="rotate(-28 342 206)"/><ellipse cx="358" cy="206" rx="7" ry="12" transform="rotate(28 358 206)"/><ellipse cx="342" cy="230" rx="7" ry="12" transform="rotate(-28 342 230)"/><ellipse cx="358" cy="230" rx="7" ry="12" transform="rotate(28 358 230)"/><ellipse cx="350" cy="184" rx="6" ry="12"/></g></g>
<g class="flour"><circle cx="80" cy="260" r="4"/><circle cx="330" cy="270" r="3"/><circle cx="110" cy="100" r="3"/><circle cx="300" cy="96" r="4"/></g>
</svg>
