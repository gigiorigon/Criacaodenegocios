<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Lupa examinando um pão">
<style>
.blob{fill:#fff;opacity:.08}
.mag{animation:scan 5s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translate(-70px,6px)}50%{transform:translate(70px,-6px)}}
.mk{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:pop 5s ease-in-out infinite}
.m2{animation-delay:1.25s}.m3{animation-delay:2.5s}
@keyframes pop{0%,8%{opacity:0;transform:scale(.3)}16%{opacity:1;transform:scale(1.12)}22%,60%{opacity:1;transform:scale(1)}72%,100%{opacity:0;transform:scale(.6)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<circle class="blob" cx="200" cy="175" r="140"/>
<path d="M70 250c0-66 260-66 260 0z" fill="#d79a4e"/><path d="M80 250c4-50 236-50 240 0" fill="#e7b46c"/>
<path d="M120 214l22-18M170 206l22-18M220 206l22-18M268 214l22-18" stroke="#f6e7c8" stroke-width="7" stroke-linecap="round"/>
<rect x="56" y="250" width="288" height="12" rx="6" fill="#0d2c57" opacity=".35"/>
<g class="mk"><circle cx="110" cy="96" r="22" fill="#008940"/><path d="M100 96l7 7 14-15" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="mk m2"><circle cx="200" cy="76" r="22" fill="#fff"/><path d="M200 64v14M200 86v1" stroke="#133e79" stroke-width="6" stroke-linecap="round"/></g>
<g class="mk m3"><circle cx="290" cy="96" r="22" fill="#fff"/><path d="M282 88l16 16M298 88l-16 16" stroke="#133e79" stroke-width="6" stroke-linecap="round"/></g>
<g class="mag"><circle cx="200" cy="200" r="46" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-width="12"/><path d="M234 234l38 38" stroke="#fff" stroke-width="16" stroke-linecap="round"/><path d="M234 234l38 38" stroke="#5fc28a" stroke-width="6" stroke-linecap="round"/></g>
</svg>
