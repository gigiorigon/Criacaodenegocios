<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Cartão de receita sendo preenchido">
<style>
.blob{fill:#fff;opacity:.08}
.card{transform-box:fill-box;transform-origin:50% 50%;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-2deg) translateY(-8px)}}
.ln{fill:none;stroke:#c5d4e6;stroke-width:8;stroke-linecap:round;stroke-dasharray:110;stroke-dashoffset:110;animation:write 6s ease-in-out infinite}
.ck{fill:none;stroke:#008940;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:check 6s ease-in-out infinite}
.l2{animation-delay:.5s}.l3{animation-delay:1s}.l4{animation-delay:1.5s}.l5{animation-delay:2s}
@keyframes write{0%{stroke-dashoffset:110}20%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:110}}
@keyframes check{0%,10%{stroke-dashoffset:30}25%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:30}}
.pin{transform-box:fill-box;transform-origin:50% 50%;animation:roll 3s ease-in-out infinite}
@keyframes roll{0%,100%{transform:translateX(-14px) rotate(-8deg)}50%{transform:translateX(14px) rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}
</style>
<circle class="blob" cx="200" cy="165" r="140"/>
<g class="card">
<rect x="112" y="40" width="180" height="240" rx="18" fill="#fff"/>
<rect x="112" y="40" width="180" height="48" rx="18" fill="#e3ecf6"/><rect x="112" y="70" width="180" height="18" fill="#e3ecf6"/>
<text x="202" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-weight="800" font-size="20" letter-spacing="3" fill="#133e79">RECEITA</text>
<g fill="none" stroke="#133e79" stroke-width="3"><rect x="130" y="106" width="18" height="18" rx="4"/><rect x="130" y="140" width="18" height="18" rx="4"/><rect x="130" y="174" width="18" height="18" rx="4"/><rect x="130" y="208" width="18" height="18" rx="4"/><rect x="130" y="242" width="18" height="18" rx="4"/></g>
<path class="ln" d="M162 115h110"/><path class="ln l2" d="M162 149h90"/><path class="ln l3" d="M162 183h104"/><path class="ln l4" d="M162 217h80"/><path class="ln l5" d="M162 251h96"/>
<path class="ck" d="M133 115l5 5 10-11"/><path class="ck l2" d="M133 149l5 5 10-11"/><path class="ck l3" d="M133 183l5 5 10-11"/><path class="ck l4" d="M133 217l5 5 10-11"/><path class="ck l5" d="M133 251l5 5 10-11"/>
</g>
<g class="pin"><rect x="250" y="268" width="110" height="22" rx="11" fill="#f6e7c8"/><rect x="232" y="274" width="22" height="10" rx="5" fill="#5fc28a"/><rect x="356" y="274" width="22" height="10" rx="5" fill="#5fc28a"/></g>
<g fill="#fff" opacity=".9"><circle cx="70" cy="90" r="4"/><circle cx="335" cy="70" r="3"/><circle cx="60" cy="240" r="3"/></g>
</svg>
