<g class="doc k2"><rect x="152" y="80" width="56" height="120" rx="8" fill="#fff" transform="rotate(-3 180 200)"/><text x="179" y="118" transform="rotate(-3 180 200)">B</text></g>
<g class="doc k3"><rect x="208" y="82" width="56" height="118" rx="8" fill="#fff" transform="rotate(4 236 200)"/><text x="237" y="120" transform="rotate(4 236 200)">C</text></g>
<g class="doc k4"><rect x="262" y="98" width="56" height="108" rx="8" fill="#e3ecf6" transform="rotate(11 290 206)"/><text x="292" y="136" fill="#008940" transform="rotate(11 290 206)">D</text></g>
</g>
