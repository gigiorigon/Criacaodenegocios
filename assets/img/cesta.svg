.k2{animation-delay:.5s}.k3{animation-delay:1s}.k4{animation-delay:1.5s}
@keyframes peek{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
